# netlify.toml
# Arquivo de configuração principal do Netlify
# Coloque este arquivo na raiz do projeto: EduBot/netlify.toml

[build]
  # Pasta onde está o frontend (gerado pelo npm run build)
  publish = "frontend/dist"

  # Comando de build do projeto
  command = "cd frontend && npm install && npm run build"

  # Pasta onde ficam as Netlify Functions
  functions = "netlify/functions"

# Redireciona tudo para o index.html (necessário para SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeçalhos globais de segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
